<!--
  Add this to the Wazuh agent configuration and mount the keycloak log
  directory at /var/log/keycloak in the agent container.

  The log format is syslog, not json: the jboss-logging listener writes
  plain console lines next to the optional canonical JSON payloads, and a
  json localfile would drop the plain lines before the manager sees them.
-->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/keycloak/keycloak.json</location>
  </localfile>
